{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="view-head">
    <div class="view-eyebrow">Overview</div>
    <h1 class="view-title">Dashboard</h1>
    <div class="view-sub">Snapshot across every cohort you coordinate.</div>
</div>

<div class="stat-grid">
    <div class="stat-card">
        <div class="stat-label">Cohorts</div>
        <div class="stat-value">{{ cohort_count }}</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Questions</div>
        <div class="stat-value">{{ question_count }}</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Assessments</div>
        <div class="stat-value">{{ assessment_count }}</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Attempts</div>
        <div class="stat-value">{{ attempt_count }}</div>
    </div>
</div>
{% endblock %}
