{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1 class="mb-3">Dashboard</h1>
  <div class="row g-3">
    <div class="col-md-3">
      <div class="card p-3">
        <h5>Cohorts</h5>
        <p class="display-6">{{ cohort_count }}</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3">
        <h5>Questions</h5>
        <p class="display-6">{{ question_count }}</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3">
        <h5>Assessments</h5>
        <p class="display-6">{{ assessment_count }}</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card p-3">
        <h5>Attempts</h5>
        <p class="display-6">{{ attempt_count }}</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
