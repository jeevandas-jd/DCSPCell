{% extends 'base.html' %}

{% block title %}{{ view.title }} Cohort{% endblock %}

{% block content %}
<div class="view-head">
    <div class="view-eyebrow">Cohort</div>
    <h1 class="view-title">{{ view.title }} cohort</h1>
</div>

<div class="panel" style="max-width:560px;">
    <form method="post" novalidate class="form-block">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-accent">Save</button>
    </form>
</div>
{% endblock %}
