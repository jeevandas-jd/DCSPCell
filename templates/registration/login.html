{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div style="display:flex;justify-content:center;padding-top:60px;">
    <div class="panel" style="width:100%;max-width:380px;">
        <div class="view-eyebrow">Welcome back</div>
        <h1 class="view-title" style="margin-bottom:18px;">Login</h1>
        <form method="post" novalidate class="form-block">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-accent" style="width:100%;">Sign in</button>
        </form>
    </div>
</div>
{% endblock %}
