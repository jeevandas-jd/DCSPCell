version: "3.9"
services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app:rw
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:placeprep}
      POSTGRES_USER: ${POSTGRES_USER:placeprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:placeprep}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A placeprep worker --loglevel=info
    volumes:
      - .:/app:rw
    env_file:
      - .env
    depends_on:
      - redis
      - db

volumes:
  db_data:
